name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m water_investigation.verify_artifacts
      - run: python -m pip install pip-audit
      # Audit the declared third-party set; the local editable package is not a PyPI artifact.
      - run: pip-audit --strict -r requirements-audit.txt
