name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Assemble static site
        env:
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -eu
          mkdir -p site/docs site/artifacts site/showcase
          cp showcase/index.html showcase/styles.css showcase/app.js showcase/config.js site/showcase/
          cp -R docs/. site/docs/
          cp artifacts/net3-multiseed-benchmark.json artifacts/sdwis-pwsid-06-public-report.json artifacts/nors-drinking-water-public-report.json site/artifacts/
          cp FINDINGS.md PRIOR_ART_REPORT.md README.md site/
          cp site/showcase/index.html site/index.html
          if [ -n "${RENDER_API_BASE_URL}" ]; then
            sed -i "s#window.WATER_AGENT_API_BASE = '';#window.WATER_AGENT_API_BASE = '${RENDER_API_BASE_URL%/}';#" site/showcase/config.js
          fi
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
