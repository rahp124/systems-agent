[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-investigation-agent"
version = "0.1.0"
description = "Cost-aware, auditable investigation agent for water-distribution events."
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.0",
  "epyt-flow==0.17.2",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["water_investigation"]
